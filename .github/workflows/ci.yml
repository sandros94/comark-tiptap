name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.17
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck code
        run: pnpm typecheck

      - name: Typecheck playgrounds
        run: pnpm typecheck:playgrounds

      - name: Test code
        run: pnpm test:coverage

      - name: Report coverage
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const summary = require("./coverage/coverage-summary.json");
            const root = process.cwd() + "/";
            const rows = ["## Test coverage", "", "| Metric | % | Covered / Total |", "| --- | ---: | ---: |"];
            for (const [metric, v] of Object.entries(summary.total))
              if (metric !== "branchesTrue") rows.push(`| ${metric} | ${v.pct} | ${v.covered} / ${v.total} |`);
            rows.push("", "<details><summary>Per-file coverage</summary>", "", "| File | Stmts | Branch | Funcs | Lines |", "| --- | ---: | ---: | ---: | ---: |");
            for (const [file, v] of Object.entries(summary).filter(([k]) => k !== "total").sort())
              rows.push(`| ${file.replace(root, "")} | ${v.statements.pct} | ${v.branches.pct} | ${v.functions.pct} | ${v.lines.pct} |`);
            rows.push("", "</details>", "");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n"));
          '

      - name: Build packages
        run: pnpm build

      - name: Publish to pkg.pr.new
        run: pnpx pkg-pr-new publish --pnpm
