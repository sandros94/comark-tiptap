packages:
  - ./
  - playgrounds/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
  vue-demi: false

ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "comark-tiptap"
  - "comark"
  - "vite"
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
